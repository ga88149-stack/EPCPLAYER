body{overflow:hidden}

.card{text-align:center;width:min(1100px,94vw)}

.top{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:16px}
.brand{font-size:30px;font-weight:900}.device{color:var(--muted)}

<script>
const DISPLAY_API = "https://script.google.com/macros/s/AKfycbzbsVQYff41MS7Y9ejk1gn5bZ_xLPXtVxIbg0IuCYyvQTnMbFYwxblMrQwpHq7WV71nsg/exec";
const DEVICE_KEY = "epcDisplayDeviceIdV2";
const POLL_MS = 3000;

const $ = id => document.getElementById(id);
function makeId(){
  if (crypto && crypto.randomUUID) return crypto.randomUUID();
  return "epc-"+Date.now()+"-"+Math.random().toString(36).slice(2);
}
function deviceId(){
  let id=localStorage.getItem(DEVICE_KEY);
  if(!id){id=makeId();localStorage.setItem(DEVICE_KEY,id)}
  return id;
}
function showCode(code){
  const s=String(code||"").replace(/\D/g,"").padEnd(6,"-").slice(0,6);
  $("code").innerHTML=[...s].map(x=>`<div class="digit">${x}</div>`).join("");
}
function status(msg,type=""){
  $("status").textContent=msg;
  $("status").className="status "+type;
}
function fail(msg,detail){
  status(msg,"err");
  $("debug").style.display="block";
  $("debug").textContent=detail||msg;
}
async function post(body){
  const r=await fetch(DISPLAY_API,{
    method:"POST",
    headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify(body),
    redirect:"follow"
  });
  const text=await r.text();
  let j;
  try{j=JSON.parse(text)}catch(e){throw new Error("API 回傳不是 JSON："+text.slice(0,250))}
  if(!j || j.ok!==true) throw new Error(j?.error||"API_ERROR");
  return j;
}
async function getState(id){
  const u=DISPLAY_API+"?action=state&deviceId="+encodeURIComponent(id)+"&_="+Date.now();
  const r=await fetch(u,{cache:"no-store",redirect:"follow"});
  const text=await r.text();
  let j;
  try{j=JSON.parse(text)}catch(e){throw new Error("STATE 回傳不是 JSON："+text.slice(0,250))}
  return j;
}
function renderPayload(p,_fromRotation){
 if(p&&p.type==='rotate'){renderRotation_(p);return}
 if(!_fromRotation){clearTimeout(epcRotateTimer);epcRotateTimer=null;epcRotateSig='';epcRotateToken++}
 const root=$("payload");
 if(!p){root.innerHTML='<div class="empty"><h2>顯示器已連線</h2><p>等待管理後台發佈顯示內容</p></div>';return}
 if(typeof p==="string"){root.innerHTML='<div class="empty"><h2>'+escapeHtml(p)+'</h2></div>';return}
 if(p.html){root.innerHTML=p.html;return}
 const rows=Array.isArray(p.rows)?p.rows:[],ui=p.ui||{},type=p.type||ui.kind||'';
 if(type==='boss'){

let epcRotateTimer=null,epcRotateToken=0,epcRotateSig='',epcRotateIndex=0;
function renderRotation_(p){
 const slides=Array.isArray(p.slides)?p.slides.filter(Boolean):[];
 if(!slides.length){clearTimeout(epcRotateTimer);epcRotateSig='';$("displayScreen").innerHTML='<div class="empty"><h2>EPC 活動輪播</h2><p>目前沒有選擇要播放的活動</p></div>';return}
 const sig=slides.map(s=>(s.type||'')+':'+Math.max(5,+s.duration||15)).join('|');
 if(epcRotateSig===sig&&epcRotateTimer)return;
 clearTimeout(epcRotateTimer);epcRotateSig=sig;epcRotateIndex=0;const token=++epcRotateToken;
 const next=()=>{if(token!==epcRotateToken)return;const s=slides[epcRotateIndex%slides.length];renderPayload(s,true);epcRotateIndex=(epcRotateIndex+1)%slides.length;epcRotateTimer=setTimeout(next,Math.max(5,+s.duration||15)*1000)};next();
}
function escapeHtml(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function paired(){
  $("pairScreen").style.display="none";
  $("displayScreen").classList.add("active");
}
async function poll(id){
  try{
    const s=await getState(id);
    if(s.ok && s.paired){
      paired();
      renderPayload(s.payload);
    }else if(s.ok){
      $("displayScreen").classList.remove("active");
      $("pairScreen").style.display="";
      if(s.code) showCode(s.code);
      status("此顯示器尚未配對，請到管理後台輸入上方 6 位數配對碼","ok");
    }
  }catch(e){}
  setTimeout(()=>poll(id),POLL_MS);
}
async function boot(){
  showCode("");
  const id=deviceId();
  try{
    const j=await post({action:"register",deviceId:id});
    if(!j.code) throw new Error("REGISTER 成功，但 API 沒有回傳 code");
    showCode(j.code);
    if(j.paired){
      status("此顯示器已配對，正在載入內容…","ok");
      paired();
    }else{
      status("配對碼已產生，請到管理後台輸入上方 6 位數","ok");
    }
    poll(id);
  }catch(e){
    fail("無法取得配對碼",String(e && e.message || e));
  }
}
boot();
