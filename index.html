<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>EPC Activity Display</title>
<style>
:root{--bg:#070d14;--panel:#0d1722;--line:#24384b;--text:#f4f7fb;--muted:#83a2bd;--gold:#e7bd55;--gold2:#f6d779;--danger:#ff6b6b;--ok:#4bd59b}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:radial-gradient(circle at 50% 35%,#132333 0,#09121c 36%,#050a10 78%);color:var(--text);font-family:Arial,"Noto Sans TC",sans-serif}
body{overflow:hidden}
.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px}
.card{text-align:center;width:min(1100px,94vw)}
h1{font-size:clamp(38px,4vw,68px);margin:0 0 16px;letter-spacing:.5px}
.sub{font-size:clamp(16px,1.5vw,25px);color:var(--muted);margin-bottom:36px}
.code{display:flex;justify-content:center;gap:16px;flex-wrap:nowrap}
.digit{width:clamp(72px,7.5vw,120px);height:clamp(96px,9vw,142px);display:flex;align-items:center;justify-content:center;border-radius:16px;background:linear-gradient(145deg,var(--gold2),var(--gold));color:#07111b;font-size:clamp(52px,6vw,88px);font-weight:900;box-shadow:0 0 28px rgba(231,189,85,.22),inset 0 1px 0 rgba(255,255,255,.65);border:1px solid #ffe394}
.status{margin-top:28px;font-size:clamp(15px,1.3vw,21px);color:var(--muted)}
.status.ok{color:var(--ok)} .status.err{color:var(--danger)}
.debug{margin:18px auto 0;max-width:900px;padding:12px 16px;border:1px solid var(--line);border-radius:10px;background:rgba(13,23,34,.86);font:14px/1.45 monospace;color:#b8cad9;display:none;word-break:break-all}
.screen{display:none;min-height:100vh;padding:28px}
.screen.active{display:block}
.top{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:16px}
.brand{font-size:30px;font-weight:900}.device{color:var(--muted)}
.content{height:calc(100vh - 95px);display:flex;align-items:center;justify-content:center;text-align:center}
.empty h2{font-size:48px;margin:0 0 12px}.empty p{font-size:22px;color:var(--muted)}
.payload{width:100%;height:100%;overflow:auto}
.payload pre{white-space:pre-wrap;text-align:left;background:var(--panel);border:1px solid var(--line);padding:24px;border-radius:16px;font-size:18px}
</style>
<style id="epcPlayerUiV2">
.board{width:min(1180px,92vw);margin:2vh auto}.board-title{font-size:clamp(42px,4.5vw,76px);font-weight:900;margin-bottom:2vh}.rank-list{display:grid;gap:10px}.rank-row{display:grid;grid-template-columns:110px 1fr 180px;align-items:center;min-height:66px;padding:10px 22px;border:1px solid var(--line);border-radius:14px;background:rgba(13,23,34,.92);text-align:left}.rank-row.top3{border-color:rgba(231,189,85,.65);background:linear-gradient(90deg,rgba(231,189,85,.13),rgba(13,23,34,.95))}.rank-no{font-size:clamp(24px,2.2vw,38px);font-weight:900;color:var(--gold)}.rank-name{font-size:clamp(24px,2.4vw,40px);font-weight:800}.rank-score{text-align:right;font-size:clamp(26px,2.5vw,42px);font-weight:900;color:var(--gold2)}.rank-score small{font-size:.5em;color:var(--muted);margin-left:6px}.board.compact .rank-row{min-height:48px;padding:6px 18px}.board.hero .rank-row:nth-child(n+4){display:none}.board.font-large .rank-name,.board.font-large .rank-score{font-size:3vw}.board.font-xlarge .rank-name,.board.font-xlarge .rank-score{font-size:3.7vw}.epc-mark{position:fixed;left:24px;top:18px;font-weight:900;color:var(--gold);letter-spacing:2px}
.epcBrandLogoV3{height:92px;max-width:250px;object-fit:contain;border-radius:10px;filter:drop-shadow(0 0 12px rgba(255,177,35,.3))}.top{min-height:112px}.brand{display:flex;align-items:center;gap:14px}.epc-mark{display:none!important}</style><style id="epcRankPosterV1">
.rank-poster{width:min(1420px,96vw);height:calc(100vh - 145px);margin:0 auto;position:relative;padding:28px 34px 24px;border:2px solid #ffb000;border-radius:24px;background:radial-gradient(circle at 50% -20%,rgba(255,95,0,.28),transparent 42%),linear-gradient(135deg,#120805 0%,#05080d 45%,#10050a 100%);box-shadow:0 0 28px rgba(255,130,0,.28),inset 0 0 70px rgba(255,50,0,.08);overflow:hidden}
.rank-poster:before,.rank-poster:after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;filter:blur(65px);opacity:.22;pointer-events:none}.rank-poster:before{background:#ff7a00;left:-100px;top:-120px}.rank-poster:after{background:#ff004c;right:-100px;bottom:-120px}
.rp-head{text-align:center;position:relative;z-index:1}.rp-kicker{font-size:clamp(16px,1.4vw,24px);font-weight:800;letter-spacing:5px;color:#ffb933}.rp-title{font-size:clamp(46px,5vw,82px);font-weight:1000;margin:2px 0;color:#fff;text-shadow:0 0 12px #ff5b00,0 3px 0 #7a2100}.rp-sub{font-size:clamp(17px,1.5vw,25px);color:#ffd67a}
.rp-podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:18px;align-items:end;max-width:1080px;margin:22px auto 18px;position:relative;z-index:1}.rp-winner{border:1px solid #ff9f1a;border-radius:20px;padding:18px;text-align:center;background:linear-gradient(180deg,rgba(70,25,5,.92),rgba(10,12,17,.96));box-shadow:0 0 20px rgba(255,126,0,.16)}.rp-winner.first{padding:26px 18px;border:2px solid #ffd34e;box-shadow:0 0 30px rgba(255,190,0,.35)}.rp-medal{font-size:42px}.rp-name{font-size:clamp(25px,2.2vw,38px);font-weight:900;margin:5px 0}.rp-points{font-size:clamp(30px,2.8vw,48px);font-weight:1000;color:#ffd34e}.rp-points small{font-size:.45em;margin-left:5px}
.rp-rest{display:grid;grid-template-columns:1fr 1fr;gap:9px 16px;max-width:1120px;margin:auto;position:relative;z-index:1}.rp-row{display:grid;grid-template-columns:80px 1fr 120px;align-items:center;padding:9px 18px;border:1px solid rgba(255,128,20,.5);border-radius:12px;background:linear-gradient(90deg,rgba(56,13,7,.86),rgba(10,17,26,.94));text-align:left}.rp-no{font-size:25px;font-weight:1000;color:#ffb32c}.rp-row .rp-name{font-size:25px;margin:0}.rp-row .rp-points{font-size:26px;text-align:right}.rp-foot{position:absolute;bottom:8px;left:0;right:0;text-align:center;color:#9aa9b8;font-size:14px;letter-spacing:2px}
</style></head>

  <div class="content"><div id="payload" class="payload"><div class="empty"><h2>顯示器已連線</h2><p>等待管理後台發佈顯示內容</p></div></div></div>
</div>

<script>
const DISPLAY_API = "https://script.google.com/macros/s/AKfycbzbsVQYff41MS7Y9ejk1gn5bZ_xLPXtVxIbg0IuCYyvQTnMbFYwxblMrQwpHq7WV71nsg/exec";
const DEVICE_KEY = "epcDisplayDeviceIdV2";
const POLL_MS = 3000;

const $ = id => document.getElementById(id);
function makeId(){
  if (crypto && crypto.randomUUID) return crypto.randomUUID();
  return "epc-"+Date.now()+"-"+Math.random().toString(36).slice(2);
}
function deviceId(){
  let id=localStorage.getItem(DEVICE_KEY);
  if(!id){id=makeId();localStorage.setItem(DEVICE_KEY,id)}
  return id;
}
function showCode(code){
  const s=String(code||"").replace(/\D/g,"").padEnd(6,"-").slice(0,6);
  $("code").innerHTML=[...s].map(x=>`<div class="digit">${x}</div>`).join("");
}
function status(msg,type=""){
  $("status").textContent=msg;
  $("status").className="status "+type;
}
function fail(msg,detail){
  status(msg,"err");
  $("debug").style.display="block";
  $("debug").textContent=detail||msg;
}
async function post(body){
  const r=await fetch(DISPLAY_API,{
    method:"POST",
    headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify(body),
    redirect:"follow"
  });
  const text=await r.text();
  let j;
  try{j=JSON.parse(text)}catch(e){throw new Error("API 回傳不是 JSON："+text.slice(0,250))}
  if(!j || j.ok!==true) throw new Error(j?.error||"API_ERROR");
  return j;
}
async function getState(id){
  const u=DISPLAY_API+"?action=state&deviceId="+encodeURIComponent(id)+"&_="+Date.now();
  const r=await fetch(u,{cache:"no-store",redirect:"follow"});
  const text=await r.text();
  let j;
  try{j=JSON.parse(text)}catch(e){throw new Error("STATE 回傳不是 JSON："+text.slice(0,250))}
  return j;
}
function renderPayload(p){
 const root=$("payload");
 if(!p){root.innerHTML='<div class="empty"><h2>顯示器已連線</h2><p>等待管理後台發佈顯示內容</p></div>';return}
 if(typeof p==="string"){root.innerHTML='<div class="empty"><h2>'+escapeHtml(p)+'</h2></div>';return}
 if(p.html){root.innerHTML=p.html;return}
 const rows=Array.isArray(p.rows)?p.rows:[],ui=p.ui||{},type=p.type||ui.kind||'';
 if(type==='boss'){
  const b=p.boss||{},max=Math.max(1,+b.initialHp||1),hp=Math.max(0,+b.hp||0),pct=Math.max(0,Math.min(100,hp/max*100)),latest=p.latest;
  root.innerHTML='<div class="board"><div class="board-title">👑 '+escapeHtml(p.title||'雙十狩王')+'</div><div style="font-size:30px;color:var(--gold);margin:20px">目前獎池 <b style="font-size:54px">$'+Number(p.pool||0).toLocaleString()+'</b> / $'+Number(p.cap||0).toLocaleString()+'</div><div style="max-width:900px;margin:25px auto;padding:28px;border:1px solid var(--gold);border-radius:18px;background:rgba(20,15,8,.75)"><div style="font-size:34px;font-weight:900">'+escapeHtml(b.name||'等待魔王')+'</div><div style="height:30px;background:#311;border-radius:20px;overflow:hidden;margin:18px 0"><div style="height:100%;width:'+pct+'%;background:linear-gradient(90deg,#b81f24,#ffcb45)"></div></div><div style="font-size:28px">HP '+hp.toLocaleString()+' / '+max.toLocaleString()+'</div></div>'+(latest?'<div style="font-size:24px">最新攻擊：'+escapeHtml(latest.member||'')+'　傷害 '+Number(latest.damage||0).toLocaleString()+'</div>':'')+'</div>';return;
 }
 if(rows.length||Array.isArray(p.rows)){
  const limit=Math.max(3,+ui.limit||10),rws=rows.slice(0,limit),medals=['🥇','🥈','🥉'];
  if(type==='rank'){
   const top=rws.slice(0,3),rest=rws.slice(3);
   const card=(r,i,first)=>r?'<div class="rp-winner '+(first?'first':'')+'"><div class="rp-medal">'+medals[i]+'</div><div class="rp-name">'+escapeHtml(r.name||r.id||'')+'</div><div class="rp-points">'+Number(r.score??0)+'<small>分</small></div></div>':'<div></div>';
   root.innerHTML='<div class="rank-poster"><div class="rp-head"><div class="rp-kicker">EIGHT POKER CLUB</div><div class="rp-title">週排行榜</div><div class="rp-sub">用實力爭取榮耀・每週競技成績排名</div></div><div class="rp-podium">'+card(top[1],1,false)+card(top[0],0,true)+card(top[2],2,false)+'</div><div class="rp-rest">'+rest.map((r,i)=>'<div class="rp-row"><div class="rp-no">#'+(i+4)+'</div><div class="rp-name">'+escapeHtml(r.name||r.id||'')+'</div><div class="rp-points">'+Number(r.score??0)+'<small>分</small></div></div>').join('')+'</div><div class="rp-foot">EPC・MORE THAN POKER</div></div>';return;
  }
  let value=x=>type==='weekly'?((x.days||0)+' 天 / '+(x.games||0)+' 場'):type==='umbrella'?((x.score||0)+' 張'):((x.score??x.total??0)+' 分');
  let label=type==='weekly'?'任務進度':type==='umbrella'?'保護傘':type==='hunter'?'獵人積分':type==='pioneer'?'先鋒積分':'總分';
  root.innerHTML='<div class="board '+escapeHtml(ui.layout||'classic')+'"><div class="board-title">'+escapeHtml(p.title||'EPC 活動')+'</div><div style="display:grid;grid-template-columns:110px 1fr 220px;padding:8px 22px;color:var(--muted);text-align:left"><b>名次</b><b>玩家</b><b style="text-align:right">'+label+'</b></div><div class="rank-list">'+rws.map((r,i)=>'<div class="rank-row '+(i<3?'top3':'')+'"><div class="rank-no">'+(medals[i]||('#'+(i+1)))+'</div><div class="rank-name">'+escapeHtml(r.name||r.id||'')+'</div><div class="rank-score">'+escapeHtml(value(r))+'</div></div>').join('')+'</div></div>';return;
 }
 if(p.title||p.subtitle){root.innerHTML='<div class="empty"><h2>'+escapeHtml(p.title||'')+'</h2><p>'+escapeHtml(p.subtitle||'')+'</p></div>';return}
 root.innerHTML="<pre>"+escapeHtml(JSON.stringify(p,null,2))+"</pre>";
}
function escapeHtml(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function paired(){
  $("pairScreen").style.display="none";
  $("displayScreen").classList.add("active");
}
async function poll(id){
  try{
    const s=await getState(id);
    if(s.ok && s.paired){
      paired();
      renderPayload(s.payload);
    }else if(s.ok){
      if(s.code) showCode(s.code);
    }
  }catch(e){}
  setTimeout(()=>poll(id),POLL_MS);
}
async function boot(){
  showCode("");
  const id=deviceId();
  try{
    const j=await post({action:"register",deviceId:id});
    if(!j.code) throw new Error("REGISTER 成功，但 API 沒有回傳 code");
    showCode(j.code);
    if(j.paired){
      status("此顯示器已配對，正在載入內容…","ok");
      paired();
    }else{
      status("配對碼已產生，請到管理後台輸入上方 6 位數","ok");
    }
    poll(id);
  }catch(e){
    fail("無法取得配對碼",String(e && e.message || e));
  }
}
boot();
</script>
